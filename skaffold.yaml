
apiVersion: skaffold/v2beta6
kind: Config
metadata:
  name: spring-petclinic-cloud

build:
  tagPolicy:
    sha256: {}
  artifacts:
    - image: 255945442255.dkr.ecr.us-east-1.amazonaws.com/carelink-staging-spring-petclinic-config-server
      context: ./spring-petclinic-config-server/target
      docker:
        dockerfile: Dockerfile
        buildArgs:
          ARTIFACT_NAME: config-server
          EXPOSED_PORT: "8888"

    - image: 255945442255.dkr.ecr.us-east-1.amazonaws.com/carelink-staging-spring-petclinic-discovery-server
      context: ./spring-petclinic-discovery-server/target
      docker:
        dockerfile: Dockerfile
        buildArgs:
          ARTIFACT_NAME: discovery-service
          EXPOSED_PORT: "8761"

    - image: 255945442255.dkr.ecr.us-east-1.amazonaws.com/carelink-staging-spring-petclinic-customers-service
      context: ./spring-petclinic-customers-service/target
      docker:
        dockerfile: Dockerfile
        buildArgs:
          ARTIFACT_NAME: customers-service
          EXPOSED_PORT: "8080"

    - image: 255945442255.dkr.ecr.us-east-1.amazonaws.com/carelink-staging-spring-petclinic-visits-service
      context: ./spring-petclinic-visits-service/target
      docker:
        dockerfile: Dockerfile
        buildArgs:
          ARTIFACT_NAME: visits-service
          EXPOSED_PORT: "8080"

    - image: 255945442255.dkr.ecr.us-east-1.amazonaws.com/carelink-staging-spring-petclinic-vets-service
      context: ./spring-petclinic-vets-service/target
      docker:
        dockerfile: Dockerfile
        buildArgs:
          ARTIFACT_NAME: vets-service
          EXPOSED_PORT: "8080"

    - image: 255945442255.dkr.ecr.us-east-1.amazonaws.com/carelink-staging-spring-petclinic-api-gateway
      context: ./spring-petclinic-api-gateway/target
      docker:
        dockerfile: Dockerfile
        buildArgs:
          ARTIFACT_NAME: api-gateway
          EXPOSED_PORT: "8080"

    - image: 255945442255.dkr.ecr.us-east-1.amazonaws.com/carelink-staging-spring-petclinic-admin-server
      context: ./spring-petclinic-admin-server/target
      docker:
        dockerfile: Dockerfile
        buildArgs:
          ARTIFACT_NAME: admin-server
          EXPOSED_PORT: "9090"



deploy:
  statusCheckDeadlineSeconds: 240

  helm:
    releases:
      - name: customers-db-mysql
        chartPath: bitnami/mysql
        valuesFiles:
          - k8s/helm-values/db-values.yaml
        namespace: spring-petclinic
        remote: true
        wait: true

      - name: vets-db-mysql
        chartPath: bitnami/mysql
        valuesFiles:
          - k8s/helm-values/db-values.yaml
        namespace: spring-petclinic
        remote: true
        wait: true

      - name: visits-db-mysql
        chartPath: bitnami/mysql
        valuesFiles:
          - k8s/helm-values/db-values.yaml
        namespace: spring-petclinic
        remote: true
        wait: true

    flags:
      install:
        - "--create-namespace"

  kubectl:
    manifests:
      - k8s/init-namespace/01-namespace.yaml
      - k8s/init-namespace/02-regcreds.yaml
      - k8s/init-services/02-config-map.yaml
      - k8s/init-services/03-role.yaml
      - k8s/init-services/05-api-gateway-service.yaml
      - k8s/init-services/06-customers-service-service.yaml
      - k8s/init-services/07-vets-service-service.yaml
      - k8s/init-services/08-visits-service-service.yaml
      - k8s/api-gateway-deployment.yaml
      - k8s/customers-service-deployment.yaml
      - k8s/vets-service-deployment.yaml
      - k8s/visits-service-deployment.yaml
      - k8s/admin-server-deployment.yaml
      - k8s/config-server-deployment.yaml
      - k8s/discovery-server-deployment.yaml

