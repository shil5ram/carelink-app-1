apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-server
  namespace: spring-petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-server
  template:
    metadata:
      labels:
        app: admin-server
    spec:
      containers:
        - name: admin-server
          image: 255945442255.dkr.ecr.us-east-1.amazonaws.com/carelink-staging-spring-petclinic-admin-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: admin-server
  namespace: spring-petclinic
spec:
  selector:
    app: admin-server
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  type: ClusterIP
