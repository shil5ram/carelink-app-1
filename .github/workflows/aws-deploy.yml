name: Build and Push CareLink Images

on:
  push:
    branches:
      - feature/aws-eks-deployment
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build and push seven services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Skaffold
        run: |
          curl -Lo skaffold \
            https://storage.googleapis.com/skaffold/releases/v2.25.0/skaffold-linux-amd64
          sudo install skaffold /usr/local/bin/skaffold
          skaffold version

      - name: Install Pack CLI
        run: |
          curl -sSL https://github.com/buildpacks/pack/releases/download/v0.36.2/pack-v0.36.2-linux.tgz -o pack.tgz
          tar -xzf pack.tgz
          sudo install pack /usr/local/bin/pack
          pack version

      - name: Build and push all seven images
        run: |
          skaffold build \
            --push=true \
            --tag=latest \
            --file-output=build-artifacts.json
