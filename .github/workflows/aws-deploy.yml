name: Build and Push CareLink Images

on:
  push:
    branches:
      - feature/aws-eks-deployment
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build and push seven services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build all seven services
        run: ./mvnw -B package --file pom.xml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Skaffold
        run: |
          curl -Lo skaffold \
            https://storage.googleapis.com/skaffold/releases/v2.25.0/skaffold-linux-amd64
          sudo install skaffold /usr/local/bin/skaffold
          skaffold version


      - name: Build and push all seven images
        run: |
          skaffold build \
            --push=true \
            --tag=latest \
            --file-output=build-artifacts.json
